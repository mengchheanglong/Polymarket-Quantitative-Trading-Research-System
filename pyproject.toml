[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-paper-agent"
version = "0.1.0"
description = "Safety-first Polymarket BTC/ETH UP-DOWN paper-trading research agent."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Research Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poly-paper = "src.main:main"

[tool.setuptools]
packages = [
    "src",
    "src.collectors",
    "src.strategies",
    "src.simulator",
    "src.risk",
    "src.storage",
    "src.reports",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
